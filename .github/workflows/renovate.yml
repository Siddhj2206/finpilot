name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-renovate.yml@b0fbcf6ca95dace8e3b4ae1860ccbbc3bbab1a53 # v1
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}
