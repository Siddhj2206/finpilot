name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-renovate.yml@4d3b97eb9760539d2b4a8f2a495db0ec3bf9e8a0 # v1
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}
