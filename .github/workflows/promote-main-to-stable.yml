---
name: Promote main to stable

# Two-branch model: `main` is the testing branch (publishes :stable-testing and
# :testing); `stable` is the production branch. The shared factory workflow
# opens (or refreshes) a squash promotion PR from `main` to `stable` daily, or
# when a maintainer dispatches it. Merging that PR triggers digest promotion in
# execute-release.yml; it does not rebuild `:stable`.
#
# Reusable logic lives in projectbluefin/actions — this is a thin caller,
# matching the pattern in projectbluefin/bluefin and projectbluefin/bluefin-lts.
# pull[bot] was considered and rejected: the factory reusable is auditable,
# org-maintained, and shared with the other image repos (see issues #235/#237).

on:
  schedule:
    # Default daily promotion window. Fork owners may change this cadence.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  # unblock-promotion-checks needs write to approve the check runs GitHub holds
  # for a bot-authored pull request. The reusable's jobs each declare their own
  # permissions, so widening the ceiling does not hand actions: write to them.
  actions: write
  contents: write
  issues: write
  packages: read
  pull-requests: write
  statuses: write

concurrency:
  group: promote-main-to-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Promote main to stable
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@b0fbcf6ca95dace8e3b4ae1860ccbbc3bbab1a53 # v1
    with:
      variants: >-
        [{"image":"${{ github.event.repository.name }}"}]
      cosign_identity_regexp: >-
        ^https://github\.com/${{ github.repository_owner }}/[^/]+/\.github/workflows/
      registry: ghcr.io/${{ github.repository_owner }}
      source_branch: main
      target_branch: stable
      # A personal image runs no e2e suites. The gate verifies the candidate
      # digest's cosign signature, and execute-release.yml re-verifies the same
      # digest before promoting it, so "release/ready" means signed and
      # unmodified, not functionally tested.
      run_e2e: false
      # The only path that auto-enrolls the PR is a merge queue, which needs an
      # organization-owned repository. Personal-account forks cannot use one.
      use_merge_queue: false
      # Enrolling without a merge queue runs `gh pr merge --auto` with no merge
      # method, and GitHub CLI refuses that without a TTY ("--merge, --rebase,
      # or --squash required when not running interactively"; observed on run
      # 35105796232). The reusable exposes no merge-method input, so the
      # arm-auto-merge job below arms auto-merge with --squash instead.
      enqueue_promotion: false
      # Personal-account forks do not have an <owner>/maintainers team.
      # Organization forks can enable this and optionally set `reviewer`.
      request_reviewer: false
    secrets: inherit

  # Two things happen here, both because the shared reusable cannot do them.
  #
  # Auto-merge: its non-queue enrollment path calls `gh pr merge --auto` with no
  # merge method, which GitHub CLI rejects outside a merge queue. A failed
  # release gate fails the reusable call, so this job never runs against a
  # blocked gate. A run with nothing to promote skips the gate but still
  # succeeds, so the release/ready label check is what keeps a no-op run from
  # arming a stale open PR. Auto-merge then waits for the approval the `stable`
  # ruleset requires and merges with the one method that ruleset allows.
  #
  # Check approval: GitHub holds every check run it creates for a bot-authored
  # pull request in `action_required` until someone approves it, so the required
  # `validate` check reports only after that. approve-trusted-promotion-runs.yml
  # clears them on a throttle-prone schedule, which left the promotion PR
  # unvalidated for most of a morning. Approving here starts validation seconds
  # after the branch is pushed; the scheduled workflow stays as the backstop.
  #
  # Whoever expects a release to follow the merge automatically: the merge is
  # performed as github-actions, and a push made with that token creates no
  # workflow runs, so execute-release.yml's `push` trigger never fires for it.
  # Dispatch Execute Release after the merge, or merge the PR by hand.
  arm-auto-merge:
    name: Arm auto-merge and unblock the promotion checks
    needs: [promote]
    if: needs.promote.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_BRANCH: auto/promote-main-to-stable
    steps:
      - name: Arm auto-merge after the release gate
        id: arm
        shell: bash
        run: |
          set -euo pipefail

          # The reusable declares no workflow-level outputs, so find the PR by
          # its deterministic head/base pair: reusable-promote-squash derives
          # auto/promote-<source>-to-<target> from the branch-model inputs.
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base stable \
            --head "${PROMOTION_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "${PR_NUMBER}" ]; then
            echo "::notice::No open promotion PR; nothing to arm."
            exit 0
          fi

          # Emitted before the label checks so the unblock step below runs for
          # any open promotion PR, whatever the gate decided.
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

          LABELS=$(gh pr view "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --json labels \
            --jq '[.labels[].name] | join(",")')

          if grep -qw 'do-not-merge' <<<"${LABELS}"; then
            echo "::notice::PR #${PR_NUMBER} carries do-not-merge; auto-merge not armed."
            exit 0
          fi
          if ! grep -qw 'release/ready' <<<"${LABELS}"; then
            echo "::notice::PR #${PR_NUMBER} is not labelled release/ready; auto-merge not armed."
            exit 0
          fi

          # --squash is mandatory: without an explicit method gh exits with
          # "--merge, --rebase, or --squash required when not running
          # interactively". The merge itself still waits on the ruleset.
          gh pr merge "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --squash \
            --auto
          echo "Armed auto-merge on PR #${PR_NUMBER}"

      - name: Approve pending runs on the promotion branch
        if: steps.arm.outputs.pr_number != ''
        shell: bash
        run: |
          set -euo pipefail

          # The same trust boundary the scheduled approver documents: only runs
          # on the bot-owned promotion branch, from the bot itself. Those
          # branches carry only commits that already passed their own PR checks.
          runs_filter=".workflow_runs[] | select(.head_branch == \"${PROMOTION_BRANCH}\") | select(.actor.login == \"github-actions[bot]\") | .id"

          approved=0
          # Runs for a freshly pushed branch appear a few seconds after the
          # push, so retry briefly instead of reporting nothing to do.
          for attempt in 1 2 3 4 5 6; do
            mapfile -t run_ids < <(
              gh api "repos/${{ github.repository }}/actions/runs?status=action_required&per_page=100" \
                --jq "${runs_filter}"
            )

            if [ "${#run_ids[@]}" -gt 0 ]; then
              for run_id in "${run_ids[@]}"; do
                if gh api -X POST "repos/${{ github.repository }}/actions/runs/${run_id}/approve" >/dev/null; then
                  echo "Approved run ${run_id}"
                  approved=$((approved + 1))
                else
                  echo "::warning::Could not approve run ${run_id}"
                fi
              done
              break
            fi

            if [ "${attempt}" -lt 6 ]; then
              sleep 15
            fi
          done

          if [ "${approved}" -eq 0 ]; then
            echo "::notice::No pending runs matched; the scheduled approver remains the backstop."
          fi
