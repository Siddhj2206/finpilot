name: PR Validation

on:
  pull_request:
    branches:
      - main
      - stable

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The repository's shell scripts are the *.sh files git tracks — the same
      # definition `just lint` uses. validate-pr word-splits this input into
      # shellcheck arguments.
      - name: Resolve shellcheck scope
        id: shell-scope
        shell: bash
        run: |
          glob="$(git ls-files '*.sh' | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          echo "glob=${glob}" >> "${GITHUB_OUTPUT}"
          echo "Resolved shellcheck scope: ${glob}"

      - name: Validate
        uses: projectbluefin/actions/bootc-build/validate-pr@ce1d0c6bb5baf8bab3a5b226e693c9fd26b3c4a8 # v1
        with:
          shellcheck-glob: ${{ steps.shell-scope.outputs.glob }}
          dockerfile: "Containerfile"
          hadolint-config: ".github/hadolint.yaml"
